<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>T3 Experience 2027</title>
<link rel="icon" href="img/logo-hub.png">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="passaporte.css">
<style>
.cap{transition:opacity .5s,transform .6s var(--ease)}
.cap.swap{opacity:0;transform:translateY(12px)}
.chap{display:flex;flex-direction:column;gap:12px;font:600 14px Inter;color:var(--mut2)}
.chap span{transition:color .4s;display:flex;gap:10px;align-items:center;justify-content:flex-end}
.chap span::after{content:"";width:8px;height:8px;border-radius:4px;background:currentColor}
.chap span.on{color:var(--gold)}
/* vertical (stories) */
.vert .stage{align-items:flex-end;padding-bottom:230px}
.vert .stage .side{display:block!important;left:72px;right:72px;top:210px;transform:none;max-width:none}
.vert .stage .side img{height:62px}
.vert .stage .side h1{font-size:68px;margin:24px 0 14px;line-height:1}
.vert .stage .side p{font-size:27px;max-width:none;line-height:1.45;color:#b4b4b9}
.vert .stage .rside{display:none!important;left:56px;right:56px;top:52px;transform:none;max-width:none}
.vert .chap{flex-direction:row;gap:10px}
.vert .chap span{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.18);font-size:0;color:transparent;overflow:hidden;position:relative}
.vert .chap span::after{display:none}
.vert .chap span.dn{background:rgba(255,255,255,.75)}
.vert .chap span.on{background:var(--gold)}
.vert .device{transform-origin:bottom center}
</style>
</head>
<body>
<div class="stage">
  <div class="side">
    <img src="img/logo.png" alt="T3 Hub">
    <div class="cap" id="cap">
      <h1 id="capT">T3 Experience<br><span class="gold">2027</span></h1>
      <p id="capS">Protótipo navegável do app do evento. Clique em tudo: agenda, ao vivo, mapa, conexões, ingresso e pagamentos.</p>
    </div>
    <p class="hint" id="hint">No celular, abra este link e adicione à tela inicial.</p>
  </div>
  <div class="rside"><div class="chap" id="chap"></div></div>
  <div class="device"><div class="app" id="app"></div></div>
</div>
<script src="icons.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script src="passaporte.js"></script>
<script>
// legenda lateral (usada no vídeo)
window.cap=(t,s)=>{const c=document.getElementById('cap');c.classList.add('swap');setTimeout(()=>{document.getElementById('capT').innerHTML=t;document.getElementById('capS').innerHTML=s;c.classList.remove('swap')},450)};
window.chapters=(list,on)=>{document.getElementById('chap').innerHTML=list.map((x,i)=>`<span class="${i===on?'on':''} ${on>=0&&i<on?'dn':''}">${x}</span>`).join('')};
</script>
</body>
</html>
